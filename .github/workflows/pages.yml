name: Publicar no GitHub Pages

# O jogo é estático (HTML + módulos ES + three.js em vendor/), então o próprio
# repositório é o site: basta enviá-lo como artefato do Pages.
on:
  push:
    branches:
      - main
      - master
      - claude/threejs-islands-boat-game-y1xq1k
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já estiver rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` liga o Pages pela API caso ainda esteja desligado.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
